<body>
    <div class="container">
        <div class="form-header">
            <h1>Share Your Experience</h1>
            <p>We value your feedback! Please take a moment to let us know about your experience with our services.</p>
            <ul class="features">
                <li><i class="fas fa-lock"></i> Your information is secure and confidential</li>
                <li><i class="fas fa-star"></i> Help us improve our services</li>
                <li><i class="fas fa-comment"></i> We read every submission</li>
            </ul>
        </div>
        
        <div class="form-container">
            <h2 class="form-title">Feedback Form</h2>
            <form id="feedbackForm">
                <div class="double-input">
                    <div class="form-group">
                        <label for="name">Name</label>
                        <input type="text" id="name" name="name" placeholder="John Carter" required>
                    </div>
                   
                </div>
                
                <div class="double-input">
                    <div class="form-group">
                        <label for="phone">Phone number</label>
                        <input type="tel" id="phone" name="phone" placeholder="(123) 456-7890">
                    </div>
                 <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" placeholder="Email address" required>
                    </div>
                </div>
                
                <div class="form-group">
                    <label class="rating-title">Your service rating</label>
                    <div class="rating-container">
                        <div class="star-rating">
                            <input type="radio" id="star5" name="rating" value="5">
                            <label for="star5"><i class="fas fa-star"></i></label>
                            
                            <input type="radio" id="star4" name="rating" value="4">
                            <label for="star4"><i class="fas fa-star"></i></label>
                            
                            <input type="radio" id="star3" name="rating" value="3">
                            <label for="star3"><i class="fas fa-star"></i></label>
                            
                            <input type="radio" id="star2" name="rating" value="2">
                            <label for="star2"><i class="fas fa-star"></i></label>
                            
                            <input type="radio" id="star1" name="rating" value="1">
                            <label for="star1"><i class="fas fa-star"></i></label>
                        </div>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="feedback">Additional feedback</label>
                    <textarea id="feedback" name="feedback" rows="3" placeholder="If you have more to add, please type it here..."></textarea>
                </div>
                
                <div class="checkbox-container">
                    <input type="checkbox" id="privacy" name="privacy" required>
                    <label for="privacy">I have read and accept the <a href="#">Privacy Policy</a></label>
                </div>
                
                <button type="submit" class="submit-btn">Submit feedback</button>
            </form>
        </div>
    </div>

  

    <script>
        document.getElementById('feedbackForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            // Form validation
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const rating = document.querySelector('input[name="rating"]:checked');
            
            if (!name || !email) {
                alert('Please fill in all required fields');
                return;
            }
            
            if (!rating) {
                alert('Please provide a service rating');
                return;
            }
            
            // Show the popup
            document.getElementById('popupOverlay').style.display = 'flex';
            
            // Reset form
            this.reset();
        });
        
        // Close popup functionality
        document.getElementById('closePopup').addEventListener('click', function() {
            document.getElementById('popupOverlay').style.display = 'none';
        });
        
        document.getElementById('popupAction').addEventListener('click', function() {
            document.getElementById('popupOverlay').style.display = 'none';
        });
        
        // Close popup when clicking outside
        document.getElementById('popupOverlay').addEventListener('click', function(e) {
            if (e.target === this) {
                this.style.display = 'none';
            }
        });
        
        // Close popup with Escape key
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                document.getElementById('popupOverlay').style.display = 'none';
            }
        });
    </script>
</body>
