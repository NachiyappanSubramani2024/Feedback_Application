

  <!-- Trigger Button -->
  <button class="open-btn" onclick="document.querySelector('.popup-overlay').style.display='flex'">Give Feedback</button>

  <!-- Popup Modal -->
  <div class="popup-overlay">
    <div class="popup-content">
      <span class="close-btn" onclick="document.querySelector('.popup-overlay').style.display='none'">&times;</span>
      <h2>Submit your feedback</h2>
      <form>
        <div class="form-group">
          <div class="icon-input">
            <i class="fas fa-user"></i>
            <input type="text" placeholder="Your name">
          </div>
          <div class="icon-input">
            <i class="fas fa-envelope"></i>
            <input type="email" placeholder="Email address">
          </div>
        </div>
        <div class="form-group">
          <div class="icon-input">
            <i class="fas fa-phone"></i>
            <input type="text" placeholder="Phone number">
          </div>
          <div class="icon-input">
            <i class="fas fa-building"></i>
            <input type="text" placeholder="Company name">
          </div>
        </div>

        <div class="rating">
          <strong>Your rating:</strong><br/>
          <i class="fas fa-star"></i>
          <i class="fas fa-star"></i>
          <i class="fas fa-star"></i>
          <i class="fas fa-star" style="color:#ccc;"></i>
          <i class="fas fa-star" style="color:#ccc;"></i>
        </div>

        <textarea rows="4" placeholder="Write your feedback..."></textarea>

        <div class="checkbox">
          <input type="checkbox" id="policy" />
          <label for="policy"> I accept the Privacy Policy</label>
        </div>

        <button class="submit-btn" type="submit">Submit Feedback</button>
      </form>
    </div>
  </div>
